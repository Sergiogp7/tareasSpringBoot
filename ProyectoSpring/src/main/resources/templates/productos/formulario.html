<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${producto.id} ? 'Editar Producto' : 'Nuevo Producto'">
      Formulario Producto
    </title>
    <link rel="stylesheet" th:href="@{/estilos/formulario.css}" />
  </head>
  <body>
    <div class="form-container">
      <h2 th:text="${producto.id} ? 'Editar Producto' : 'Nuevo Producto'"></h2>
      <form
        th:action="@{${producto.id} != null ? '/productos/' + ${producto.id} : '/productos'}"
        th:object="${producto}"
        method="post"
      >
        <div class="form-group">
          <label>Nombre:</label>
          <input type="text" th:field="*{nombre}" required />
        </div>
        <div class="form-group">
          <label>Descripción:</label>
          <input type="text" th:field="*{descripcion}" required />
        </div>
        <div class="form-group">
          <label>Precio:</label>
          <input type="number" step="0.01" th:field="*{precio}" required />
        </div>
        <div class="form-group">
          <label>Stock:</label>
          <input type="number" th:field="*{stock}" required />
        </div>
        <button type="submit">Guardar</button>
      </form>
      <a th:href="@{/productos}" class="back-link">Volver a la lista</a>
    </div>
  </body>
</html>
