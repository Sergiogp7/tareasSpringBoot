<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Lista de Productos</title>
    <link rel="stylesheet" th:href="@{/estilos/lista.css}" />
  </head>
  <body>
    <form th:action="@{/logout}" method="post" style="float: right">
      <input type="submit" value="Cerrar Sesión" />
    </form>
    <h1>Lista de Productos</h1>

    <a th:href="@{/productos/nuevo}" class="btn-nuevo">Crear Nuevo Producto</a>
    <br /><br />

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="producto : ${productos}">
          <td th:text="${producto.id}"></td>
          <td th:text="${producto.nombre}"></td>
          <td th:text="${producto.descripcion}"></td>
          <td th:text="${producto.precio}"></td>
          <td th:text="${producto.stock}"></td>
          <td>
            <a
              th:href="@{/productos/editar/{id}(id=${producto.id})}"
              class="btn-editar"
              >Editar</a
            >
            <a
              th:href="@{/productos/eliminar/{id}(id=${producto.id})}"
              class="btn-eliminar"
              onclick="
                return confirm('¿Estás seguro de eliminar este producto?');
              "
              >Eliminar</a
            >
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
