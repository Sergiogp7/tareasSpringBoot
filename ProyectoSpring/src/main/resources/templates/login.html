<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #fff;
        color: #000;
      }

      .login-container {
        border: 1px solid #ccc;
        padding: 20px;
        width: 300px;
      }

      h2 {
        text-align: center;
        margin-top: 0;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
      }

      button {
        width: 100%;
        padding: 10px;
        background-color: #333;
        color: white;
        border: none;
        cursor: pointer;
      }

      button:hover {
        background-color: #555;
      }

      .alert-error {
        color: red;
        margin-bottom: 15px;
        text-align: center;
        font-size: 0.9em;
      }

      .alert-logout {
        color: green;
        margin-bottom: 15px;
        text-align: center;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>Login</h2>
      <div th:if="${param.error}" class="alert-error">
        Usuario o contraseña incorrectos.
      </div>
      <div th:if="${param.logout}" class="alert-logout">
        Has cerrado sesión.
      </div>
      <form th:action="@{/login}" method="post">
        <div class="form-group">
          <label>Usuario</label>
          <input type="text" name="username" required />
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" name="password" required />
        </div>
        <button type="submit">Entrar</button>
      </form>
    </div>
  </body>
</html>
