<div th:unless="${productos.isEmpty()}">
  <table class="table">
    <tr th:each="producto : ${productos.content}">
      <td><span th:text="${producto.nombre}"></span></td>
      <td><span th:text="${producto.descripcion}"></span></td>
      <!-- Ver detalle: /productos/{id} -->
      <td>
        <a th:href="@{/productos/{id}(id=${producto.id})}"> Ver detalle</a>
      </td>
      <!-- Editar: /productos/{id}/editar -->
      <td>
        <a th:href="@{/productos/{id}/editar(id=${producto.id})}">Editar</a>
      </td>
      <!-- Eliminar: /productos/{id}/eliminar -->
      <td>
        <a th:href="@{/productos/{id}/eliminar(id=${producto.id})}">Eliminar</a>
      </td>
    </tr>
  </table>

  <div>
    <span th:if="${productos.hasPrevious()}">
      <a
        th:href="@{/productos(page=${productos.number - 1}, size=${productos.size})}"
        >Anterior</a
      >
    </span>
    <span
      th:text="'Página ' + ${productos.number + 1} + ' de ' + ${productos.totalPages}"
    ></span>
    <span th:if="${productos.hasNext()}">
      <a
        th:href="@{/productos(page=${productos.number + 1}, size=${productos.size})}"
        >Siguiente</a
      >
    </span>
  </div>
</div>
