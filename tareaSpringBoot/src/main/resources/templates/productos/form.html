<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Editar Producto</title>
  </head>
  <body>
    <h1>Editar Producto</h1>
    <form
      th:action="@{/productos/{id}/editar(id=${producto.id})}"
      th:object="${producto}"
      method="post"
    >
      <div>
        <label>Nombre: </label>
        <input type="text" th:field="*{nombre}" />
      </div>
      <div>
        <label>Descripción: </label>
        <input type="text" th:field="*{descripcion}" />
      </div>
      <div>
        <label>Precio: </label>
        <input type="number" step="0.01" th:field="*{precio}" />
      </div>
      <div>
        <label>Stock: </label>
        <input type="number" th:field="*{stock}" />
      </div>
      <div>
        <button type="submit">Guardar</button>
      </div>
    </form>
    <a th:href="@{/productos}">Volver a la lista</a>
  </body>
</html>
